plugins { id 'com.android.application' }

android {
    namespace 'com.rahulkakkireni.clearspace'
    compileSdk 35

    defaultConfig {
        applicationId 'com.rahulkakkireni.clearspace'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
    implementation 'androidx.documentfile:documentfile:1.0.1'
}
