name: Build Android APK

on:
  push:
    branches: [codex/macos-dmg]
    paths:
      - "android/**"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/macos-dmg
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build release APK
        working-directory: android
        run: gradle --no-daemon clean assembleRelease
      - name: Verify APK
        run: |
          mkdir -p android/dist
          cp android/app/build/outputs/apk/release/app-release.apk android/dist/ClearSpace-Android-1.0.0.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs android/dist/ClearSpace-Android-1.0.0.apk | tee android-build-verification.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging android/dist/ClearSpace-Android-1.0.0.apk | head -20 | tee -a android-build-verification.txt
          sha256sum android/dist/ClearSpace-Android-1.0.0.apk | tee -a android-build-verification.txt
      - name: Commit verified APK
        run: |
          git config user.name "ClearSpace Build"
          git config user.email "actions@users.noreply.github.com"
          git add android/dist/ClearSpace-Android-1.0.0.apk android-build-verification.txt
          git commit -m "Build verified Android APK [skip ci]"
          git push origin HEAD:codex/macos-dmg
